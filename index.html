<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>Fantasy Gameday Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#f7f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1080px;margin:auto;padding:14px 10px 88px}.head,.bar,.top,.th{display:flex;justify-content:space-between;align-items:center}.ey{font-size:10px;color:#37e3df;font-weight:900;letter-spacing:.12em}.h1{font-size:25px;font-weight:950;margin:3px 0}.mut{font-size:10px;color:#8fa0b8}.btn{border:1px solid #2b3b57;background:#121c2d;color:#fff;border-radius:11px;padding:9px 11px;font-weight:850;text-decoration:none}.bar{margin:10px 0;background:#0d1727;border:1px solid #22324c;border-radius:13px;padding:10px 11px;font-size:11px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#09111d;border:1px solid #1d2b43;border-radius:14px;padding:5px;position:sticky;top:4px;z-index:10}.tab{border:0;background:transparent;color:#8fa0b8;border-radius:10px;padding:10px 3px;font-size:11px;font-weight:900}.tab.on{background:#1a2942;color:#fff}.view{display:none}.view.on{display:block}.sect{display:flex;justify-content:space-between;align-items:end;margin:17px 2px 9px}.sect h2{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:linear-gradient(180deg,#111b2c,#0b121f);border:1px solid #24334d;border-radius:17px;padding:12px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--a,#61a8ff)}.badge{font-size:10px;font-weight:900;background:#1b2941;border-radius:999px;padding:5px 8px}.src{font-size:9px;color:#91a1b8;text-align:right;max-width:55%}.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px;align-items:center;margin-top:9px}.r{text-align:right}.tn{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:29px;font-weight:950}.vs{font-size:9px;color:#64758e}.metric{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;padding:7px 0;border-top:1px solid #1d2a40}.lab{text-align:center;font-size:9px;color:#8394ab}.v,.rv{font-size:13px;font-weight:900}.rv{text-align:right}.notice{font-size:9px;color:#91a2b9;margin-top:7px}.player{background:#0d1626;border:1px solid #20304b;border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.pn{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm{font-size:9px;color:#91a2b9;margin-top:3px}.pts{text-align:right;font-size:18px;font-weight:950}.lg{text-align:right;font-size:9px;color:#37e3df}.tb{background:#0b1320;border:1px solid #24334d;border-radius:17px;margin-bottom:10px;overflow:hidden}.th{padding:11px 12px;background:#101a2b}.rows{padding:3px 8px 8px}.row{display:grid;grid-template-columns:42px minmax(0,1fr) 59px;gap:6px;align-items:center;padding:8px 1px;border-bottom:1px solid #1b2941}.row:last-child{border-bottom:0}.pos{font-size:9px;text-align:center;font-weight:900;background:#1b2940;border-radius:7px;padding:4px 2px}.rn{font-size:12px;font-weight:850}.rd{font-size:9px;color:#8293aa}.rs{text-align:right;font-size:13px;font-weight:900}.conn{background:#0d1625;border:1px solid #24334d;border-radius:16px;padding:13px;margin-bottom:10px}.conn h3{margin:0;font-size:15px}.state{font-size:9px;font-weight:900;padding:5px 7px;border-radius:999px}.ok{background:#143726;color:#6df0ab}.warn{background:#3a2d12;color:#ffd478}.conn p{font-size:11px;line-height:1.5;color:#9aacbf}.code{font-size:10px;overflow-wrap:anywhere;background:#07101d;border:1px solid #263650;padding:9px;border-radius:10px}.field{display:flex;gap:6px;margin-top:6px}.field input{min-width:0;flex:1;background:#07101d;color:#fff;border:1px solid #2c3c58;border-radius:10px;padding:10px}.empty{padding:15px;text-align:center;color:#8fa0b8;border:1px dashed #30415f;border-radius:14px}.hidden{display:none!important}.footer{position:fixed;left:0;right:0;bottom:0;background:#080d17ee;border-top:1px solid #22314a;padding:7px 9px calc(7px + env(safe-area-inset-bottom));z-index:20}.footerIn{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.fb{border:0;background:#111a2a;color:#8fa0b8;border-radius:10px;padding:9px 3px;font-size:9px;font-weight:900}.fb.on{background:#1a2942;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}.score{font-size:27px}}@media(min-width:900px){#matches{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="head"><div><div class="ey">GAME DAY COMMAND CENTER</div><div class="h1">Fantasy Gameday Hub</div><div class="mut">ESPN · Yahoo · Sleeper ×2</div></div><button id="refresh" class="btn">↻</button></div>
<div class="bar"><span id="status">Loading…</span><span id="stamp" class="mut">—</span></div>
<nav class="tabs"><button class="tab on" data-tab="overview">Overview</button><button class="tab" data-tab="live">Live Now</button><button class="tab" data-tab="teams">All Teams</button><button class="tab" data-tab="connections">Connections</button></nav>
<section id="overview" class="view on"><div class="sect"><h2>All matchups</h2><span class="mut">30-sec refresh</span></div><div id="matches" class="grid"></div></section>
<section id="live" class="view"><div class="sect"><h2>Live snapshot</h2><span id="liveCount" class="mut"></span></div><div id="liveBox" class="grid"></div></section>
<section id="teams" class="view"><div class="sect"><h2>Every lineup</h2><span class="mut">tap ▾ to collapse</span></div><div id="teamsBox"></div></section>
<section id="connections" class="view"><div class="sect"><h2>Connections</h2><span class="mut">secure provider setup</span></div><div id="connBox"></div></section>
</div>
<div class="footer"><div class="footerIn"><button class="fb on" data-go="overview">▦ Overview</button><button class="fb" data-go="live">● Live</button><button class="fb" data-go="teams">☰ Teams</button><button class="fb" data-go="connections">⚙ Connect</button></div></div>
<script>
const API='https://wnxplqpvbfiljnijksqv.supabase.co/functions/v1/fantasy-gameday';let DATA=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=n=>n==null||Number.isNaN(+n)?'—':(Math.abs(+n-Math.round(+n))<.005?String(Math.round(+n)):(+n).toFixed(2));
function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('on',b.dataset.go===id));history.replaceState(null,'','#'+id)}
function matchup(x){return '<div class="card" style="--a:'+esc(x.accent)+'"><div class="top"><span class="badge">'+esc(x.platform)+'</span><span class="src">'+esc(x.source)+'</span></div><div class="match"><div><div class="tn">'+esc(x.team)+'</div><div class="score">'+fmt(x.score)+'</div></div><div class="vs">VS</div><div class="r"><div class="tn">'+esc(x.opponent)+'</div><div class="score">'+fmt(x.oppScore)+'</div></div></div><div class="metric"><span class="v">'+fmt(x.projected)+'</span><span class="lab">PROJECTED</span><span class="rv">'+fmt(x.oppProjected)+'</span></div><div class="metric"><span class="v">'+(x.winProb==null?'—':fmt(x.winProb)+'%')+'</span><span class="lab">WIN PROBABILITY</span><span class="rv">'+(x.oppWinProb==null?'—':fmt(x.oppWinProb)+'%')+'</span></div><div class="notice">'+esc(x.projectionSource||'')+'</div></div>'}
function row(p){return '<div class="row"><span class="pos">'+esc(p.pos)+'</span><div><div class="rn">'+esc(p.name)+'</div><div class="rd">'+esc(p.team||'')+(p.projection!=null?' · proj '+fmt(p.projection):'')+'</div></div><div class="rs">'+fmt(p.points)+'</div></div>'}
function team(x){return '<div class="tb"><div class="th"><div><b>'+esc(x.platform)+' · '+esc(x.team)+'</b><div class="mut">'+fmt(x.score)+' vs '+fmt(x.oppScore)+' · '+esc(x.source)+'</div></div><button class="btn collapse">▾</button></div><div class="rows">'+(x.starters||[]).map(row).join('')+((x.bench||[]).length?'<div class="mut" style="padding:8px 2px 2px;font-weight:900">BENCH</div>'+x.bench.map(row).join(''):'')+'</div></div>'}
function connections(){const c=DATA.connections||{},y=c.yahoo||{},p=c.espn||{},configured=!!DATA.yahoo?.configured;return '<div class="conn"><div class="top"><h3>Sleeper</h3><span class="state ok">CONNECTED</span></div><p>Direct read-only connection to <b>@Hindes67</b>.</p></div><div class="conn"><div class="top"><h3>Yahoo Fantasy</h3><span class="state '+(y.status==="connected"?"ok":"warn")+'">'+(y.status==="connected"?"CONNECTED":configured?"READY TO AUTHORIZE":"SETUP NEEDED")+'</span></div><p>Yahoo uses official OAuth. Your Yahoo password never passes through this dashboard.</p><div class="mut">Callback URL</div><div class="code">'+esc(DATA.yahoo.callback)+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button id="copyY" class="btn">Copy callback</button><a class="btn" target="_blank" href="https://developer.yahoo.com/apps/">Yahoo Developer</a>'+(configured?'<a class="btn" href="'+API+'/yahoo/start">Connect Yahoo</a>':'')+'</div>'+(configured?'':'<p>After creating the Yahoo app, paste the Consumer Key and Secret here. They are sent over HTTPS to the backend and are not stored in this webpage.</p><div class="field"><input id="yClient" placeholder="Yahoo Consumer Key"></div><div class="field"><input id="ySecret" type="password" placeholder="Yahoo Consumer Secret"></div><div class="field"><input id="ySetup" type="password" placeholder="Owner setup key"><button id="ySave" class="btn">Save</button></div><div id="yMsg" class="notice"></div>')+'</div><div class="conn"><div class="top"><h3>ESPN Fantasy</h3><span class="state '+(p.status==="connected"?"ok":"warn")+'">'+(p.status==="connected"?"CONNECTED":"SETUP NEEDED")+'</span></div><p>Enter the numeric ESPN League ID. Public-viewable leagues can connect without your ESPN password.</p><div class="field"><input id="espnId" inputmode="numeric" placeholder="ESPN League ID" value="'+esc(p.metadata?.league_id||'')+'"><button id="espnGo" class="btn">Connect</button></div><div id="espnMsg" class="notice">'+(p.status==="connected"?"League ID saved and verified.":"Using today's screenshot data until connected.")+'</div></div>'}
function render(){const L=DATA.leagues||[];document.getElementById('matches').innerHTML=L.map(matchup).join('');document.getElementById('teamsBox').innerHTML=L.map(team).join('');const live=[];L.forEach(x=>(x.starters||[]).forEach(p=>{if(p.points!=null&&+p.points!==0)live.push({...p,platform:x.platform,owner:x.team})}));document.getElementById('liveCount').textContent=live.length+' scoring';document.getElementById('liveBox').innerHTML=live.length?live.slice(0,24).map(p=>'<div class="player"><div><div class="pn">'+esc(p.name)+'</div><div class="pm">'+esc(p.team)+' · '+esc(p.platform)+'</div></div><div><div class="pts">'+fmt(p.points)+'</div><div class="lg">'+esc(p.owner)+'</div></div></div>').join(''):'<div class="empty">No scored players yet.</div>';document.getElementById('connBox').innerHTML=connections()}
async function load(){const s=document.getElementById('status');s.textContent='Refreshing…';try{const r=await fetch(API+'/data',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error();DATA=d;render();s.innerHTML='<span style="color:#39e58d">● LIVE</span> · @'+esc(d.username)+(d.week?' · Week '+esc(d.week):'');document.getElementById('stamp').textContent=new Date(d.generatedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})}catch(e){s.textContent='Refresh failed · keeping last good screen'}}
document.addEventListener('click',async ev=>{const t=ev.target.closest('.tab');if(t)return go(t.dataset.tab);const f=ev.target.closest('.fb');if(f)return go(f.dataset.go);const c=ev.target.closest('.collapse');if(c){const q=c.closest('.tb').querySelector('.rows');q.classList.toggle('hidden');c.textContent=q.classList.contains('hidden')?'▸':'▾';return}if(ev.target.id==='copyY'){await navigator.clipboard.writeText(DATA.yahoo.callback);ev.target.textContent='Copied';return}if(ev.target.id==='ySave'){const m=document.getElementById('yMsg');m.textContent='Saving securely…';const r=await fetch(API+'/yahoo/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clientId:document.getElementById('yClient').value.trim(),clientSecret:document.getElementById('ySecret').value.trim(),setupKey:document.getElementById('ySetup').value.trim()})});const d=await r.json();m.textContent=d.ok?'Saved. Tap Connect Yahoo.':'Could not save: '+d.error;if(d.ok)load();return}if(ev.target.id==='espnGo'){const m=document.getElementById('espnMsg');m.textContent='Checking ESPN league…';const r=await fetch(API+'/espn/connect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({leagueId:document.getElementById('espnId').value.trim()})});const d=await r.json();m.textContent=d.ok?'Connected. Refreshing…':d.error;if(d.ok)load()}});
document.getElementById('refresh').onclick=load;const h=location.hash.replace('#','');if(['overview','live','teams','connections'].includes(h))go(h);load();setInterval(load,30000);
</script></body></html>
